#Tela de progresso
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Timeline - Progresso</title>
  <link rel="stylesheet" href="../static/css/progresso.css">
</head>
<body>

  <header>
    <a href="index.html"><strong>Timeline</strong></a>
    <button class="user-btn">Dados de demonstração</button>
  </header>

  <div class="tela">
    <h1>Seu Progresso</h1>
    <p class="subtitulo">Siga nesse ritmo</p>

    <div class="cards">
      <div class="box">
        <h3>Concluídas</h3>
        <p class="numero">12 / 16</p>
      </div>
      <div class="box">
        <h3>Dias organizados</h3>
        <p class="numero">5</p>
        <p class="texto-cinza">seguidos</p>
      </div>
    </div>

    <div class="box">
      <h3>Meta da semana</h3>
      <div class="bar" style="margin-top: 12px;"><div class="fill" style="width: 75%;"></div></div>
      <p class="texto-cinza">Você concluiu 3 de 4 metas</p>
    </div>

    <div class="box">
      <h3>Distribuição de tempo</h3>

      <p class="linha"><span>Cálculo 2</span><strong>6h</strong></p>
      <div class="bar"><div class="fill" style="width: 85%;"></div></div>

      <p class="linha"><span>Física 2</span><strong>4h</strong></p>
      <div class="bar"><div class="fill" style="width: 55%;"></div></div>

      <p class="linha"><span>Atividades</span><strong>5h</strong></p>
      <div class="bar"><div class="fill" style="width: 70%;"></div></div>

      <p class="linha"><span>Leitura</span><strong>2h</strong></p>
      <div class="bar"><div class="fill" style="width: 30%;"></div></div>
    </div>
  </div>

</body>
</html>
